<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Kamera-Keyboard Prototyp</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
  }

  #cam {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    background: #111;
  }

  #darken {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.15);
    z-index: 1;
    pointer-events: none;
  }

  #placeholder {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
    background: #000;
  }
  #placeholder.hidden { display: none; }
  #placeholder h1 { font-size: 20px; font-weight: 500; margin: 0; }
  #placeholder p { font-size: 14px; line-height: 1.5; margin: 0; opacity: 0.8; max-width: 320px; }
  #placeholder button {
    margin-top: 8px;
    background: #fff;
    color: #000;
    border: none;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
  }
  #cam-error {
    color: #ff8a8a;
    font-size: 13px;
    margin-top: 12px;
    max-width: 320px;
    display: none;
  }

  #statusbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    padding-top: max(12px, env(safe-area-inset-top));
    color: #fff;
    font-size: 13px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }

  #chat-area {
    position: absolute;
    top: 60px;
    left: 12px;
    right: 12px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .bubble {
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #fff;
    padding: 10px 14px;
    border-radius: 16px 16px 16px 4px;
    max-width: 75%;
    font-size: 14px;
    line-height: 1.4;
  }

  #input-wrap {
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 10px 14px;
    border-radius: 12px;
    align-self: flex-end;
    max-width: 85%;
    min-width: 60%;
  }

  #text-input {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 15px;
    width: 100%;
    outline: none;
    font-family: inherit;
  }
  #text-input::placeholder { color: rgba(255,255,255,0.6); }

  #controls {
    position: absolute;
    top: 100px;
    right: 16px;
    z-index: 4;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ctrl-btn {
    width: 44px;
    height: 44px;
    border-radius: 999px;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 0.5px solid rgba(255,255,255,0.3);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    padding: 0;
  }

  #keyboard {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 3;
    padding: 8px 4px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .kb-row {
    display: flex;
    gap: 5px;
    padding: 0 4px;
  }
  .kb-row.r2 { padding: 0 22px; }

  .kb-key {
    flex: 1;
    min-width: 0;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.22);
    color: #fff;
    border-radius: 6px;
    font-size: 18px;
    font-weight: 400;
    border: 0.5px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
    transition: background 0.08s;
  }
  .kb-key:active { background: rgba(255,255,255,0.45); }
  .kb-key.wide { flex: 1.5; font-size: 14px; }
  .kb-key.space { flex: 5; font-size: 14px; }

  #app.dim-low .kb-key {
    background: rgba(255,255,255,0.10);
    border-color: rgba(255,255,255,0.08);
  }
  #app.dim-high .kb-key {
    background: rgba(0,0,0,0.5);
    border-color: rgba(255,255,255,0.25);
  }
</style>
</head>
<body>

<div id="app">

  <video id="cam" autoplay playsinline muted></video>
  <div id="darken"></div>

  <div id="placeholder">
    <h1>Kamera-Keyboard</h1>
    <p>Beim Tippen während du gehst zeigt diese App das Live-Kamerabild hinter den Tasten, damit du Hindernisse vor dir siehst.</p>
    <p style="font-size: 12px; opacity: 0.6;">Funktioniert am besten auf dem Smartphone über HTTPS (oder lokal als Datei auf iOS Safari / Android Chrome).</p>
    <button id="start-btn">Kamera starten</button>
    <p id="cam-error"></p>
  </div>

  <div id="statusbar">
    <span style="font-weight: 500;">9:41</span>
    <span>● ● ● ●</span>
  </div>

  <div id="chat-area">
    <div class="bubble">Hey, bin auf dem Weg!</div>
    <div id="input-wrap">
      <input id="text-input" type="text" placeholder="Nachricht..." autocomplete="off" />
    </div>
  </div>

  <div id="controls">
    <button class="ctrl-btn" id="toggle-dim" title="Tasten-Helligkeit">◐</button>
    <button class="ctrl-btn" id="toggle-cam" title="Kamera an/aus">📷</button>
  </div>

  <div id="keyboard">
    <div class="kb-row" data-row="0"></div>
    <div class="kb-row r2" data-row="1"></div>
    <div class="kb-row" data-row="2"></div>
    <div class="kb-row" data-row="3"></div>
  </div>

</div>

<script>
(function(){
  const layout = [
    ['q','w','e','r','t','z','u','i','o','p'],
    ['a','s','d','f','g','h','j','k','l'],
    ['⇧','y','x','c','v','b','n','m','⌫'],
    ['123','😊','space','↵']
  ];
  const wide = new Set(['⇧','⌫','123','😊','↵']);
  const input = document.getElementById('text-input');

  document.querySelectorAll('.kb-row').forEach((row, i) => {
    layout[i].forEach(k => {
      const el = document.createElement('div');
      el.className = 'kb-key' + (wide.has(k) ? ' wide' : '') + (k === 'space' ? ' space' : '');
      el.textContent = k === 'space' ? 'Leerzeichen' : k;
      el.addEventListener('click', () => {
        if (k === '⌫') input.value = input.value.slice(0, -1);
        else if (k === 'space') input.value += ' ';
        else if (k === '↵' || k === '⇧' || k === '123' || k === '😊') { /* no-op in prototype */ }
        else input.value += k;
      });
      row.appendChild(el);
    });
  });

  const video = document.getElementById('cam');
  const placeholder = document.getElementById('placeholder');
  const startBtn = document.getElementById('start-btn');
  const toggleCam = document.getElementById('toggle-cam');
  const toggleDim = document.getElementById('toggle-dim');
  const errorEl = document.getElementById('cam-error');
  const app = document.getElementById('app');
  let stream = null;
  let dimState = 0;

  async function startCamera() {
    errorEl.style.display = 'none';
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });
      video.srcObject = stream;
      placeholder.classList.add('hidden');
    } catch (e) {
      errorEl.style.display = 'block';
      errorEl.textContent = 'Fehler: ' + e.message + '. Wenn du die Datei lokal öffnest, brauchst du HTTPS oder localhost. Auf iOS musst du Safari nutzen.';
    }
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
      video.srcObject = null;
      placeholder.classList.remove('hidden');
    }
  }

  startBtn.addEventListener('click', startCamera);
  toggleCam.addEventListener('click', () => stream ? stopCamera() : startCamera());
  toggleDim.addEventListener('click', () => {
    dimState = (dimState + 1) % 3;
    app.classList.remove('dim-low', 'dim-high');
    if (dimState === 1) app.classList.add('dim-low');
    if (dimState === 2) app.classList.add('dim-high');
  });
})();
</script>

</body>
</html>
